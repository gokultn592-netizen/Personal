services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nqueens-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - nqueens-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nqueens-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
    networks:
      - nqueens-net

networks:
  nqueens-net:
    driver: bridge
