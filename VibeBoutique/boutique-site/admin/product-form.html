<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique Admin — Product Editor</title>
  <meta name="description" content="Add a new catalog product or edit details, adjust pricing, stock quantities, and upload public images.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Injected by main.js -->
  <header></header>

  <main class="section">
    <div class="container">
      <div style="max-width: 700px; margin: 0 auto;">
        
        <div style="margin-bottom: var(--spacing-md); display: flex; justify-content: space-between; align-items: center;">
          <div>
            <p class="section-subtitle">Catalog Admin</p>
            <h1 class="section-title" id="form-page-title">Add New Product</h1>
          </div>
          <a href="dashboard.html" class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.8rem;">
            Cancel
          </a>
        </div>

        <form id="product-editor-form" class="checkout-card" style="box-shadow: var(--shadow-md);">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-sm);">
            <!-- Name -->
            <div class="form-group" style="grid-column: 1 / -1;">
              <label for="prod-name">Product Name *</label>
              <input type="text" id="prod-name" class="form-input" placeholder="e.g. Linen Gold Trim Kimono" required>
            </div>

            <!-- Category -->
            <div class="form-group">
              <label for="prod-category">Category *</label>
              <input type="text" id="prod-category" class="form-input" placeholder="e.g. Lounge" required>
            </div>

            <!-- Featured Checkbox -->
            <div class="form-group" style="display: flex; flex-direction: row; align-items: center; gap: 0.5rem; height: 100%; margin-top: 1.5rem;">
              <input type="checkbox" id="prod-featured" style="width: 18px; height: 18px; cursor: pointer;">
              <label for="prod-featured" style="cursor: pointer; margin: 0;">Feature on Homepage</label>
            </div>

            <!-- Price -->
            <div class="form-group">
              <label for="prod-price">Retail Price (₹) *</label>
              <input type="number" id="prod-price" class="form-input" step="0.01" min="0" placeholder="180.00" required>
            </div>

            <!-- Stock -->
            <div class="form-group">
              <label for="prod-stock">Stock Units *</label>
              <input type="number" id="prod-stock" class="form-input" min="0" placeholder="5" required>
            </div>

            <!-- Sizes -->
            <div class="form-group">
              <label for="prod-sizes">Sizes (comma-separated)</label>
              <input type="text" id="prod-sizes" class="form-input" placeholder="e.g. S, M, L">
            </div>

            <!-- Dynamic Stock By Size Section -->
            <div id="size-stock-container" style="display: none; grid-column: 1 / -1; background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: var(--spacing-sm); margin-top: var(--spacing-xs); margin-bottom: var(--spacing-sm);">
              <h4 style="font-size: 0.9rem; margin-bottom: 0.5rem; color: var(--accent-gold); font-family: var(--font-heading);">Stock by Size</h4>
              <div id="size-stock-inputs" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: var(--spacing-sm);">
                <!-- Dynamic inputs injected by JS -->
              </div>
            </div>

            <!-- Colors -->
            <div class="form-group">
              <label for="prod-colors">Colors (comma-separated)</label>
              <input type="text" id="prod-colors" class="form-input" placeholder="e.g. Ivory, Sandy Beige">
            </div>

            <!-- Dynamic Color Photos Section -->
            <div id="color-photos-container" style="display: none; grid-column: 1 / -1; background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: var(--spacing-sm); margin-top: var(--spacing-xs); margin-bottom: var(--spacing-sm);">
              <h4 style="font-size: 0.9rem; margin-bottom: 0.5rem; color: var(--accent-gold); font-family: var(--font-heading);">Photos by Color</h4>
              <div id="color-photos-inputs" style="display: flex; flex-direction: column; gap: var(--spacing-xs);">
                <!-- Dynamic inputs injected by JS -->
              </div>
            </div>

            <!-- Description -->
            <div class="form-group" style="grid-column: 1 / -1;">
              <label for="prod-desc">Product Description</label>
              <textarea id="prod-desc" class="form-input" rows="4" placeholder="Describe materials, fit, care instructions..." style="resize: vertical; font-family: inherit;"></textarea>
            </div>


          </div>

          <div style="margin-top: var(--spacing-md); display: flex; gap: var(--spacing-sm); justify-content: flex-end; border-top: 1px solid var(--border-color); padding-top: var(--spacing-sm);">
            <a href="dashboard.html" class="btn btn-secondary">Discard</a>
            <button type="submit" id="save-product-btn" class="btn btn-primary">Save Product</button>
          </div>
        </form>

      </div>
    </div>
  </main>

  <!-- Injected by main.js -->
  <footer></footer>

  <!-- Scripts -->
  <script type="module" src="../js/main.js"></script>
  <script type="module">
    import { doc, getDoc, setDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { db, isConfigured } from "../js/firebase-config.js";
    import { requireAdmin } from "../js/auth.js";
    import { mockProducts } from "../js/products.js";

    let editProductId = null;
    let existingImageUrl = "";

    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Enforce admin-only access
      const session = await requireAdmin();
      if (!session) return;

      // 2. Determine Edit vs Add Mode
      const params = new URLSearchParams(window.location.search);
      editProductId = params.get("id");

      if (editProductId) {
        document.getElementById("form-page-title").textContent = "Edit Product";
        document.title = "Edit Product — VibeBoutique Admin";
        await loadProductData(editProductId);
      } else {
        document.getElementById("form-page-title").textContent = "Add New Product";
        document.title = "Add Product — VibeBoutique Admin";
      }


      // 4. Bind sizes input for dynamic size-specific stock fields
      const sizesInput = document.getElementById("prod-sizes");
      if (sizesInput) {
        sizesInput.addEventListener("input", updateVariantStockFields);
      }

      // Bind colors input for dynamic color-specific photo and stock fields
      const colorsInput = document.getElementById("prod-colors");
      if (colorsInput) {
        colorsInput.addEventListener("input", () => {
          updateColorPhotoFields();
          updateVariantStockFields();
        });
      }

      // 5. Bind Form Submission
      const form = document.getElementById("product-editor-form");
      if (form) {
        form.addEventListener("submit", handleFormSave);
      }
    });

    async function loadProductData(id) {
      let product = null;

      if (isConfigured) {
        try {
          const snap = await getDoc(doc(db, "products", id));
          if (snap.exists()) {
            product = snap.data();
          }
        } catch (e) {
          console.error("Failed to load edit product from Firestore:", e);
        }
      }

      // Fallback check
      if (!product) {
        const savedMocks = JSON.parse(localStorage.getItem("boutique_mock_products") || "[]");
        product = savedMocks.find(p => p.id === id) || mockProducts.find(p => p.id === id);
      }

      if (!product) {
        alert("Product not found. Returning to dashboard.");
        window.location.href = "dashboard.html";
        return;
      }

      // Fill form values
      document.getElementById("prod-name").value = product.name || "";
      document.getElementById("prod-category").value = product.category || "";
      document.getElementById("prod-featured").checked = !!product.featured;
      document.getElementById("prod-price").value = product.price || "";
      document.getElementById("prod-stock").value = product.stock || "";
      document.getElementById("prod-sizes").value = (product.sizes || []).join(", ");
      document.getElementById("prod-colors").value = (product.colors || []).join(", ");
      
      updateColorPhotoFields();
      if (product.colorImages) {
        const inputsWrapper = document.getElementById("color-photos-inputs");
        if (inputsWrapper) {
          inputsWrapper.querySelectorAll(".color-img-input").forEach((input, index) => {
            const color = input.getAttribute("data-color");
            if (color && product.colorImages[color]) {
              input.value = product.colorImages[color];
              const preview = document.getElementById(`color-preview-${index}`);
              if (preview) {
                preview.src = product.colorImages[color];
                preview.style.display = "block";
              }
            }
          });
        }
      }

      updateVariantStockFields();
      if (product.variantStock) {
        const inputsWrapper = document.getElementById("size-stock-inputs");
        if (inputsWrapper) {
          inputsWrapper.querySelectorAll("input.variant-stock-input").forEach(input => {
            const path = input.getAttribute("data-path");
            if (path) {
              if (path.includes("-")) {
                const [color, size] = path.split("-");
                if (product.variantStock[color] && product.variantStock[color][size] !== undefined) {
                  input.value = product.variantStock[color][size];
                }
              } else {
                if (product.variantStock[path] !== undefined) {
                  input.value = product.variantStock[path];
                }
              }
            }
          });
        }
        calculateTotalStock();
      } else if (product.sizesStock) {
        const inputsWrapper = document.getElementById("size-stock-inputs");
        if (inputsWrapper) {
          inputsWrapper.querySelectorAll("input.variant-stock-input").forEach(input => {
            const path = input.getAttribute("data-path");
            if (path && product.sizesStock[path] !== undefined) {
              input.value = product.sizesStock[path];
            }
          });
        }
        calculateTotalStock();
      }

      document.getElementById("prod-desc").value = product.description || "";
      
      if (product.imageUrl) {
        existingImageUrl = product.imageUrl;
      }
    }


    async function handleFormSave(e) {
      e.preventDefault();

      const saveBtn = document.getElementById("save-product-btn");
      if (saveBtn) {
        saveBtn.textContent = "Saving...";
        saveBtn.disabled = true;
      }

      // Collect data
      const name = document.getElementById("prod-name").value.trim();
      const category = document.getElementById("prod-category").value.trim();
      const featured = document.getElementById("prod-featured").checked;
      const price = parseFloat(document.getElementById("prod-price").value);
      const stock = parseInt(document.getElementById("prod-stock").value);
      const description = document.getElementById("prod-desc").value.trim();
      
      // Parse arrays
      const sizes = document.getElementById("prod-sizes").value
        .split(",")
        .map(s => s.trim())
        .filter(Boolean);
      const colors = document.getElementById("prod-colors").value
        .split(",")
        .map(c => c.trim())
        .filter(Boolean);

      // Parse variantStock
      const variantStock = {};
      if (colors.length > 0 && sizes.length > 0) {
        colors.forEach(color => {
          variantStock[color] = {};
          sizes.forEach(size => {
            const input = document.getElementById(`variant-stock-${color}-${size}`);
            variantStock[color][size] = input ? (parseInt(input.value) || 0) : 0;
          });
        });
      } else if (colors.length > 0) {
        colors.forEach(color => {
          const input = document.getElementById(`variant-stock-${color}`);
          variantStock[color] = input ? (parseInt(input.value) || 0) : 0;
        });
      } else if (sizes.length > 0) {
        sizes.forEach(size => {
          const input = document.getElementById(`variant-stock-${size}`);
          variantStock[size] = input ? (parseInt(input.value) || 0) : 0;
        });
      }

      // Legacy flat sizesStock helper for backward compatibility
      const sizesStock = {};
      if (sizes.length > 0) {
        sizes.forEach(size => {
          if (colors.length > 0) {
            let sizeSum = 0;
            colors.forEach(color => {
              sizeSum += (variantStock[color] && variantStock[color][size]) || 0;
            });
            sizesStock[size] = sizeSum;
          } else {
            sizesStock[size] = variantStock[size] || 0;
          }
        });
      }

      // Parse colorImages
      const colorImages = {};
      if (colors.length > 0) {
        colors.forEach((color, index) => {
          const input = document.getElementById(`color-img-${index}`);
          if (input && input.value.trim()) {
            colorImages[color] = input.value.trim();
          }
        });
      }

      // Automatically assign cover image from the first color image, or fallback to existingImageUrl
      let imageUrl = "";
      if (colors.length > 0 && colorImages[colors[0]]) {
        imageUrl = colorImages[colors[0]];
      } else if (existingImageUrl) {
        imageUrl = existingImageUrl;
      } else {
        const firstUploaded = Object.values(colorImages).find(url => url);
        imageUrl = firstUploaded || "";
      }

      if (!imageUrl) {
        alert("Please upload at least one image under Photos by Color.");
        if (saveBtn) {
          saveBtn.textContent = "Save Product";
          saveBtn.disabled = false;
        }
        return;
      }

      const productPayload = {
        name,
        category,
        featured,
        price,
        stock,
        sizes,
        colors,
        description,
        imageUrl,
        sizesStock: sizes.length > 0 ? sizesStock : null, // Store size-specific stocks
        variantStock: Object.keys(variantStock).length > 0 ? variantStock : null, // Store variation stocks
        colorImages: Object.keys(colorImages).length > 0 ? colorImages : null, // Store color-specific images
        updatedAt: isConfigured ? serverTimestamp() : new Date()
      };

      if (isConfigured) {
        try {
          if (editProductId) {
            // Update mode
            await setDoc(doc(db, "products", editProductId), productPayload, { merge: true });
          } else {
            // Create mode
            productPayload.createdAt = serverTimestamp();
            await addDoc(collection(db, "products"), productPayload);
          }
          window.location.href = "dashboard.html";
          return;
        } catch (error) {
          console.error("Firestore product save error:", error);
          alert("Failed to write to database: " + error.message);
        }
      }

      // Mock Save Mode
      let savedMocks = JSON.parse(localStorage.getItem("boutique_mock_products") || "null");
      if (!savedMocks) {
        savedMocks = [...mockProducts];
      }

      if (editProductId) {
        const index = savedMocks.findIndex(p => p.id === editProductId);
        if (index > -1) {
          savedMocks[index] = { ...savedMocks[index], ...productPayload };
        }
      } else {
        const newProduct = {
          id: "MOCK-" + Math.random().toString(36).substr(2, 9).toUpperCase(),
          ...productPayload,
          createdAt: { seconds: Date.now() / 1000 }
        };
        savedMocks.push(newProduct);
      }

      localStorage.setItem("boutique_mock_products", JSON.stringify(savedMocks));
      window.location.href = "dashboard.html";
    }

    function updateVariantStockFields() {
      const sizesInput = document.getElementById("prod-sizes");
      const colorsInput = document.getElementById("prod-colors");
      const stockInput = document.getElementById("prod-stock");
      const container = document.getElementById("size-stock-container");
      const inputsWrapper = document.getElementById("size-stock-inputs");

      if (!sizesInput || !colorsInput || !stockInput || !container || !inputsWrapper) return;

      const sizes = sizesInput.value
        .split(",")
        .map(s => s.trim())
        .filter(Boolean);

      const colors = colorsInput.value
        .split(",")
        .map(c => c.trim())
        .filter(Boolean);

      // Keep track of values the user might have already typed
      const currentValues = {};
      inputsWrapper.querySelectorAll("input.variant-stock-input").forEach(input => {
        const path = input.getAttribute("data-path");
        if (path) {
          currentValues[path] = parseInt(input.value) || 0;
        }
      });

      if (colors.length > 0 || sizes.length > 0) {
        container.style.display = "block";
        stockInput.readOnly = true;
        stockInput.style.backgroundColor = "var(--bg-secondary)";
        stockInput.style.cursor = "not-allowed";

        let html = "";
        
        if (colors.length > 0 && sizes.length > 0) {
          document.querySelector("#size-stock-container h4").textContent = "Stock by Color & Size";
          colors.forEach(color => {
            html += `
              <div style="grid-column: 1 / -1; margin-top: 0.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.25rem;">
                <strong style="color: var(--text-primary); font-size: 0.85rem;"><i class="fas fa-palette"></i> ${color} Variation Stock</strong>
              </div>
            `;
            sizes.forEach(size => {
              const path = `${color}-${size}`;
              const val = currentValues[path] !== undefined ? currentValues[path] : 0;
              html += `
                <div style="display: flex; flex-direction: column; gap: 2px;">
                  <label for="variant-stock-${path}" style="font-size: 0.78rem; margin: 0; font-weight: 500;">Size ${size} Stock</label>
                  <input type="number" id="variant-stock-${path}" data-path="${path}" class="form-input variant-stock-input" min="0" value="${val}" style="padding: 0.4rem; font-size: 0.85rem;" required>
                </div>
              `;
            });
          });
        } else if (colors.length > 0) {
          document.querySelector("#size-stock-container h4").textContent = "Stock by Color";
          colors.forEach(color => {
            const path = color;
            const val = currentValues[path] !== undefined ? currentValues[path] : 0;
            html += `
              <div style="display: flex; flex-direction: column; gap: 2px;">
                <label for="variant-stock-${path}" style="font-size: 0.8rem; margin: 0; font-weight: 500;">${color} Stock</label>
                <input type="number" id="variant-stock-${path}" data-path="${path}" class="form-input variant-stock-input" min="0" value="${val}" style="padding: 0.4rem; font-size: 0.85rem;" required>
              </div>
            `;
          });
        } else {
          document.querySelector("#size-stock-container h4").textContent = "Stock by Size";
          sizes.forEach(size => {
            const path = size;
            const val = currentValues[path] !== undefined ? currentValues[path] : 0;
            html += `
              <div style="display: flex; flex-direction: column; gap: 2px;">
                <label for="variant-stock-${path}" style="font-size: 0.8rem; margin: 0; font-weight: 500;">Size ${size} Stock</label>
                <input type="number" id="variant-stock-${path}" data-path="${path}" class="form-input variant-stock-input" min="0" value="${val}" style="padding: 0.4rem; font-size: 0.85rem;" required>
              </div>
            `;
          });
        }

        inputsWrapper.innerHTML = html;

        // Bind event listeners to newly created inputs to calculate overall stock sum
        inputsWrapper.querySelectorAll("input").forEach(input => {
          input.addEventListener("input", calculateTotalStock);
        });

        calculateTotalStock();
      } else {
        container.style.display = "none";
        inputsWrapper.innerHTML = "";
        stockInput.readOnly = false;
        stockInput.style.backgroundColor = "";
        stockInput.style.cursor = "";
      }
    }

    function calculateTotalStock() {
      const inputsWrapper = document.getElementById("size-stock-inputs");
      const stockInput = document.getElementById("prod-stock");
      if (!inputsWrapper || !stockInput) return;

      let total = 0;
      inputsWrapper.querySelectorAll("input.variant-stock-input").forEach(input => {
        total += parseInt(input.value) || 0;
      });
      stockInput.value = total;
    }

    function updateColorPhotoFields() {
      const colorsInput = document.getElementById("prod-colors");
      const container = document.getElementById("color-photos-container");
      const inputsWrapper = document.getElementById("color-photos-inputs");

      if (!colorsInput || !container || !inputsWrapper) return;

      const colors = colorsInput.value
        .split(",")
        .map(c => c.trim())
        .filter(Boolean);

      // Keep track of values the user might have already typed or uploaded
      const currentValues = {};
      inputsWrapper.querySelectorAll(".color-img-input").forEach(input => {
        const color = input.getAttribute("data-color");
        if (color) {
          currentValues[color] = input.value.trim();
        }
      });

      if (colors.length > 0) {
        container.style.display = "block";

        let html = "";
        colors.forEach((color, index) => {
          const val = currentValues[color] !== undefined ? currentValues[color] : "";
          html += `
            <div style="display: flex; flex-direction: column; gap: 4px; padding: var(--spacing-sm); border: 1px dashed var(--border-color); border-radius: var(--radius-sm); background: white; margin-bottom: var(--spacing-xs);">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <label style="font-size: 0.85rem; margin: 0; font-weight: 600; color: var(--text-primary);"><i class="fas fa-palette"></i> ${color} Image</label>
                <span class="text-muted" style="font-size: 0.72rem;">Upload or enter URL</span>
              </div>
              <div style="display: flex; gap: var(--spacing-xs); align-items: center;">
                <input type="text" id="color-img-${index}" data-color="${color}" class="form-input color-img-input" value="${val}" placeholder="https://example.com/image.jpg" style="flex: 1; padding: 0.4rem; font-size: 0.85rem;">
                <label class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.78rem; cursor: pointer; display: flex; align-items: center; gap: 0.3rem; margin: 0;">
                  <i class="fas fa-upload"></i> Upload
                  <input type="file" class="color-img-file-input" data-index="${index}" data-color="${color}" accept="image/*" style="display: none;">
                </label>
              </div>
              <div class="progress-bar-container" id="color-upload-progress-${index}" style="display: none; height: 4px; margin-top: 4px;">
                <div class="progress-bar" id="color-upload-bar-${index}" style="width: 0%;"></div>
              </div>
              <img id="color-preview-${index}" src="${val}" alt="${color} preview" style="display: ${val ? 'block' : 'none'}; width: 60px; height: 60px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border-color); margin-top: 6px;">
            </div>
          `;
        });
        inputsWrapper.innerHTML = html;

        // Bind upload event listeners to file inputs
        inputsWrapper.querySelectorAll(".color-img-file-input").forEach(fileInput => {
          fileInput.addEventListener("change", (e) => {
            const idx = fileInput.getAttribute("data-index");
            const color = fileInput.getAttribute("data-color");
            handleColorImageUpload(e, idx, color);
          });
        });

        // Bind change listener to text inputs for updating previews manually
        inputsWrapper.querySelectorAll(".color-img-input").forEach((input, index) => {
          input.addEventListener("input", () => {
            const preview = document.getElementById(`color-preview-${index}`);
            if (preview) {
              preview.src = input.value.trim();
              preview.style.display = input.value.trim() ? "block" : "none";
            }
          });
        });
      } else {
        container.style.display = "none";
        inputsWrapper.innerHTML = "";
      }
    }

    async function handleColorImageUpload(e, idx, color) {
      const file = e.target.files[0];
      if (!file) return;

      if (file.size > 32 * 1024 * 1024) {
        alert("File size exceeds 32MB. Please upload a smaller image.");
        e.target.value = "";
        return;
      }

      const progressContainer = document.getElementById(`color-upload-progress-${idx}`);
      const progressBar = document.getElementById(`color-upload-bar-${idx}`);
      const preview = document.getElementById(`color-preview-${idx}`);
      const textInput = document.getElementById(`color-img-${idx}`);

      if (progressContainer) progressContainer.style.display = "block";
      if (progressBar) progressBar.style.width = "20%";

      try {
        if (progressBar) progressBar.style.width = "40%";

        // Convert file to base64
        const fileBase64 = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = () => resolve(reader.result.split(",")[1]);
          reader.onerror = (err) => reject(err);
        });

        if (progressBar) progressBar.style.width = "60%";

        const payload = {
          fileName: file.name,
          fileType: file.type,
          fileBase64: fileBase64
        };

        const apiEndpoint = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
          ? "http://localhost:3000/api/upload-image"
          : "/api/upload-image";

        const response = await fetch(apiEndpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (progressBar) progressBar.style.width = "85%";

        const result = await response.json();

        if (response.ok && result.success && result.imageUrl) {
          if (progressBar) progressBar.style.width = "100%";
          if (textInput) textInput.value = result.imageUrl;
          if (preview) {
            preview.src = result.imageUrl;
            preview.style.display = "block";
          }
        } else {
          throw new Error(result.error || "Upload proxy error");
        }
      } catch (err) {
        console.error(`Upload failed for ${color}:`, err);
        alert(`Upload failed for ${color}: ` + err.message);
      } finally {
        setTimeout(() => {
          if (progressContainer) progressContainer.style.display = "none";
        }, 3000);
      }
    }
